name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            target: linux-amd64
          - goos: darwin
            goarch: amd64
            target: darwin-amd64
          - goos: darwin
            goarch: arm64
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dist/asana-cli-${VERSION}-${{ matrix.target }}
          go build -o dist/asana-cli-${VERSION}-${{ matrix.target }}/asana-cli ./cmd/asana-cli
          tar -C dist -czf dist/asana-cli-${VERSION}-${{ matrix.target }}.tar.gz asana-cli-${VERSION}-${{ matrix.target }}
          (cd dist && sha256sum asana-cli-${VERSION}-${{ matrix.target }}.tar.gz > asana-cli-${VERSION}-${{ matrix.target }}.tar.gz.sha256)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/asana-cli-*.tar.gz
            dist/asana-cli-*.sha256
